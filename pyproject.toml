[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biogas-digester-twin"
version = "0.1.0"
description = "Which methods detect and classify anaerobic digester upsets earliest and with the fewest false alarms: FOS/TAC thresholds, EWMA/CUSUM, PCA, gradient boosting and an EKF twin on an ADM1 (BSM2) simulation of an agricultural co-digestion plant, with a false-alarm check on open farm-scale data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
biogas-twin = "biogas_twin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
